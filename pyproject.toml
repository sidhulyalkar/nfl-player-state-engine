[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-player-state-engine"
version = "0.11.0"
description = "Leakage-safe probabilistic NFL player projections, frozen replay, and game simulation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sidharth Hulyalkar"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "duckdb>=1.1",
  "pyarrow>=17.0",
  "nflreadpy>=0.1.5",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]
dashboard = ["streamlit>=1.38", "plotly>=5.24"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
intelligence = ["httpx>=0.27", "beautifulsoup4>=4.12", "feedparser>=6.0"]
browser = ["httpx>=0.27", "beautifulsoup4>=4.12", "feedparser>=6.0", "playwright>=1.50"]
historical = ["pyreadr>=0.5"]
espn = ["espn-api>=0.46.0"]
all = ["nfl-player-state-engine[dev,dashboard,intelligence,historical,api,espn]"]

[project.scripts]
pse = "player_state_engine.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
