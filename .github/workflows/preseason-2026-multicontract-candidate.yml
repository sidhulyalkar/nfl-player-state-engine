name: 2026 multicontract preseason candidate rehearsal

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/preseason-2026-multicontract-candidate.yml'
      - 'scripts/materialize_multicontract_preseason_2026_candidate.py'
      - 'src/player_state_engine/product/preseason_multicontract_candidate.py'
      - 'tests/test_preseason_multicontract_candidate.py'
      - 'src/player_state_engine/fantasy/preseason.py'
      - 'tests/test_preseason_status_family_guards.py'
      - 'src/player_state_engine/fantasy/preseason_league_score.py'
      - 'src/player_state_engine/evaluation/uncertainty_qualification.py'
      - 'scripts/run_direct_league_score_preseason_benchmark.py'
      - 'scripts/run_direct_league_score_conformal_qualification.py'
      - 'src/player_state_engine/fantasy/projection_contracts.py'
      - 'src/player_state_engine/product/release_readiness.py'
      - 'src/player_state_engine/product/special_teams_market.py'
      - 'scripts/refresh_special_teams_market.py'
      - 'src/player_state_engine/product/nfl_hub.py'
      - 'scripts/refresh_nfl_hub.py'
      - 'configs/fantasy/**'
  pull_request:
    paths:
      - '.github/workflows/preseason-2026-multicontract-candidate.yml'
      - 'scripts/materialize_multicontract_preseason_2026_candidate.py'
      - 'src/player_state_engine/product/preseason_multicontract_candidate.py'
      - 'tests/test_preseason_multicontract_candidate.py'
      - 'src/player_state_engine/fantasy/preseason.py'
      - 'tests/test_preseason_status_family_guards.py'
      - 'src/player_state_engine/fantasy/preseason_league_score.py'
      - 'src/player_state_engine/evaluation/uncertainty_qualification.py'
      - 'scripts/run_direct_league_score_preseason_benchmark.py'
      - 'scripts/run_direct_league_score_conformal_qualification.py'
      - 'src/player_state_engine/fantasy/projection_contracts.py'
      - 'src/player_state_engine/product/release_readiness.py'
      - 'src/player_state_engine/product/special_teams_market.py'
      - 'scripts/refresh_special_teams_market.py'
      - 'src/player_state_engine/product/nfl_hub.py'
      - 'scripts/refresh_nfl_hub.py'
      - 'configs/fantasy/**'

permissions:
  contents: read

jobs:
  materialize-and-rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release environment
        run: python -m pip install -e '.[dev]'
      - name: Qualify candidate contracts
        run: |
          ruff check \
            src/player_state_engine/product/preseason_multicontract_candidate.py \
            tests/test_preseason_multicontract_candidate.py \
            src/player_state_engine/fantasy/preseason.py \
            tests/test_preseason_status_family_guards.py
          python -m compileall -q \
            scripts/materialize_multicontract_preseason_2026_candidate.py \
            src/player_state_engine/product/preseason_multicontract_candidate.py \
            src/player_state_engine/fantasy/preseason.py
          pytest -q \
            tests/test_preseason_multicontract_candidate.py \
            tests/test_preseason_status_family_guards.py \
            tests/test_multicontract_product_serving.py \
            tests/test_multicontract_release_readiness.py
      - name: Regenerate frozen direct-score evidence once
        run: |
          python scripts/run_direct_league_score_preseason_benchmark.py \
            --output-dir /tmp/direct_league_score_preseason
      - name: Regenerate inherited uncertainty evidence from exact direct benchmark
        run: |
          python scripts/run_direct_league_score_conformal_qualification.py \
            --benchmark-root /tmp/direct_league_score_preseason \
            --output-dir /tmp/direct_league_score_conformal
      - name: Refresh observational 2026 NFL Hub
        run: |
          python scripts/refresh_nfl_hub.py \
            --season 2026 \
            --root /tmp/nfl_hub
      - name: Refresh external-market-only K and DST evidence
        run: |
          python scripts/refresh_special_teams_market.py \
            --season 2026 \
            --output /tmp/special_teams_market.json
      - name: Materialize immutable 2026 multicontract challenger
        run: |
          python scripts/materialize_multicontract_preseason_2026_candidate.py \
            --season 2026 \
            --direct-evidence-root /tmp/direct_league_score_preseason \
            --uncertainty-evidence-root /tmp/direct_league_score_conformal \
            --nfl-hub-snapshot /tmp/nfl_hub/current.json \
            --bundle-root artifacts/preseason_2026_multicontract_candidate \
            --registry-root artifacts/registry
      - name: Require exact challenger rehearsal state across all three league profiles
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          import pandas as pd

          from player_state_engine import __version__
          from player_state_engine.fantasy.league import LeagueConfig
          from player_state_engine.product.release_readiness import assess_draft_release_readiness

          root = Path('artifacts/preseason_2026_multicontract_candidate')
          product = pd.read_csv(root / 'product_player_values.csv')
          metadata_by_slug = json.loads((root / 'contract_metadata.json').read_text())
          qualification = json.loads((root / 'qualification_evidence.json').read_text())
          hub = json.loads(Path('/tmp/nfl_hub/current.json').read_text())
          special = json.loads(Path('/tmp/special_teams_market.json').read_text())

          league_paths = {
              '8_team_ppr_2qb_expanded': Path('configs/fantasy/8_team_ppr_2qb_expanded.yaml'),
              '12_team_half_ppr_median': Path('configs/fantasy/12_team_half_ppr_median.yaml'),
              '12_team_half_ppr_median_2qb': Path(
                  'configs/fantasy/12_team_half_ppr_median_2qb.yaml'
              ),
          }
          leagues = {slug: LeagueConfig.from_yaml(path) for slug, path in league_paths.items()}
          assert (
              leagues['12_team_half_ppr_median'].scoring_contract_id
              == leagues['12_team_half_ppr_median_2qb'].scoring_contract_id
          ), 'Roster construction must not create a fake third scoring contract.'
          projection_sets = {
              config.scoring_contract_id: product.loc[
                  product['scoring_contract_id'].astype(str).eq(config.scoring_contract_id)
              ].copy()
              for config in leagues.values()
          }
          contract_metadata = {
              str(item['scoring_contract_id']): item for item in metadata_by_slug.values()
          }
          cutoff = datetime.fromisoformat(
              str(qualification['source_cutoff_utc']).replace('Z', '+00:00')
          )
          report = assess_draft_release_readiness(
              projection_sets,
              contract_metadata,
              leagues,
              bundle_authority='challenger',
              bundle_integrity_verified=True,
              projection_source_cutoff_utc=cutoff,
              nfl_hub_snapshot=hub,
              special_teams_market_snapshot=special,
              package_version=__version__,
              expected_release_version='0.17.0',
              now=datetime.now(UTC),
          )
          release_payload = report.as_dict()
          print(json.dumps(release_payload, indent=2, default=str))
          report_root = Path('artifacts/release_reports')
          report_root.mkdir(parents=True, exist_ok=True)
          (report_root / 'preseason_2026_multicontract_rehearsal.json').write_text(
              json.dumps(release_payload, indent=2, sort_keys=True, default=str) + '\n',
              encoding='utf-8',
          )
          assert report.status == 'BLOCKED', report
          assert report.promotion_rehearsal_eligible is True, report
          assert report.rehearsal_status == 'PROVISIONAL', report
          assert report.blocking_reasons == (
              'PROJECTION_BUNDLE_NOT_PRODUCTION_APPROVED',
          ), report.blocking_reasons
          assert {item.league for item in report.leagues} == set(league_paths), report.leagues
          assert all(item.core_readiness and item.core_readiness.ready for item in report.leagues)
          assert len(product) >= 500, len(product)
          assert product['player_id'].nunique() >= 250
          assert not product.duplicated(['scoring_contract_id', 'player_id']).any()
          assert set(product['decision_quantile_policy']) == {
              'qualified_distribution',
              'q50_only',
          }
          PY
      - name: Upload complete rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preseason-2026-multicontract-candidate-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            /tmp/direct_league_score_preseason
            /tmp/direct_league_score_conformal
            /tmp/nfl_hub/current.json
            /tmp/special_teams_market.json
            artifacts/preseason_2026_multicontract_candidate
            artifacts/registry
            artifacts/release_reports/preseason_2026_multicontract_rehearsal.json
