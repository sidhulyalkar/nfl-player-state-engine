name: weekly-game-intelligence

on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season to refresh
        required: true
        default: "2026"
      completed_week:
        description: Latest completed week; leave blank to infer from PBP
        required: false
        default: ""
  schedule:
    - cron: "30 13 * * 2"

permissions:
  contents: read

jobs:
  research-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: python -m pip install -e '.[intelligence]'
      - name: Resolve season
        id: season
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            echo "value=${{ github.event.inputs.season }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          fi
      - name: Acquire point-in-time sources
        run: |
          SEASON="${{ steps.season.outputs.value }}"
          PREV1=$((SEASON-1))
          PREV2=$((SEASON-2))
          python scripts/acquire_game_intelligence_sources.py \
            --season "$PREV2" --season "$PREV1" --season "$SEASON" \
            --output-dir data/raw/game_intelligence
      - name: Build weekly challenger and replay
        shell: bash
        run: |
          WEEK_ARGS=()
          if [ -n "${{ github.event.inputs.completed_week }}" ]; then
            WEEK_ARGS=(--completed-week "${{ github.event.inputs.completed_week }}")
          fi
          python scripts/weekly_game_intelligence_refresh.py \
            --pbp data/raw/game_intelligence/play_by_play.parquet \
            --schedules data/raw/game_intelligence/schedules.parquet \
            --players data/raw/game_intelligence/players.parquet \
            --season "${{ steps.season.outputs.value }}" \
            --simulations-per-game 100 \
            "${WEEK_ARGS[@]}"
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: game-intelligence-${{ steps.season.outputs.value }}
          path: |
            artifacts/game_intelligence/weekly
            artifacts/models/game_intelligence/registry.json
          if-no-files-found: warn
          retention-days: 30
