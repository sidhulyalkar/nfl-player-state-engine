name: NFL Hub public-data smoke

on:
  pull_request:
    paths:
      - ".github/workflows/nfl-hub-public-smoke.yml"
      - "src/player_state_engine/product/nfl_hub.py"
      - "src/player_state_engine/api/nfl_hub_routes.py"
      - "scripts/refresh_nfl_hub.py"
      - "tests/test_nfl_hub.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-hub-public-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-data-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -e .
      - name: Refresh real 2026 NFL Hub sources
        run: |
          python scripts/refresh_nfl_hub.py \
            --season 2026 \
            --root artifacts/nfl_hub_public_smoke \
            --projections artifacts/does-not-exist.csv
      - name: Assert observational and roster-source contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(
              Path('artifacts/nfl_hub_public_smoke/current.json').read_text(encoding='utf-8')
          )
          assert snapshot['authority'] == 'observational_nfl_state_only'
          assert snapshot['season'] == 2026
          assert snapshot['player_count'] >= 500
          assert snapshot['event_count'] == 0
          health = {item['source']: item for item in snapshot['source_health']}
          assert health['rosters']['required'] is True
          assert health['rosters']['available'] is True
          assert health['rosters']['rows'] >= 500
          assert 'projection_q50' not in snapshot['players'][0] or snapshot['players'][0]['projection_q50'] is None
          PY
      - name: Upload source-health snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nfl-hub-public-smoke-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/nfl_hub_public_smoke/current.json
