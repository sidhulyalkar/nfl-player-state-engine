name: historical-official-availability-v2-resume

on:
  push:
    branches:
      - experiment/historical-official-availability-v1
    paths:
      - ".github/workflows/historical-official-availability-v2-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-official-availability-v2-resume
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Record diagnostic retirement
        run: |
          echo "The all-games v2 resume experiment is superseded."
          echo "Reason: the historical adapter did not recognize nflverse long-form practice-status strings, and postseason rows are outside the primary fantasy use case."
          echo "The REG-only experiment on the same frozen baseline is the authoritative follow-up."
