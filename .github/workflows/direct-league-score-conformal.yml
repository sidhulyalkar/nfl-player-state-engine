name: Direct league-score conformal qualification

on:
  pull_request:
    paths:
      - "src/player_state_engine/evaluation/uncertainty_qualification.py"
      - "src/player_state_engine/models/conformal.py"
      - "src/player_state_engine/fantasy/preseason_league_score.py"
      - "scripts/run_direct_league_score_preseason_benchmark.py"
      - "scripts/run_direct_league_score_conformal_qualification.py"
      - "tests/test_uncertainty_qualification.py"
      - ".github/workflows/direct-league-score-conformal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qualification environment
        run: python -m pip install -e '.[dev]'
      - name: Qualify implementation contracts
        run: |
          ruff check \
            src/player_state_engine/evaluation/uncertainty_qualification.py \
            scripts/run_direct_league_score_conformal_qualification.py \
            tests/test_uncertainty_qualification.py
          pytest -q \
            tests/test_uncertainty_qualification.py \
            tests/test_preseason_league_score.py
      - name: Regenerate exact direct league-score benchmark
        run: |
          python scripts/run_direct_league_score_preseason_benchmark.py \
            --output-dir /tmp/direct_league_score_preseason
      - name: Require both frozen direct-score gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/direct_league_score_preseason/qualification.json').read_text())
          assert manifest['authority'] == 'direct_league_score_research_only', manifest
          assert manifest['automatic_promotion'] is False, manifest
          assert manifest['leagues'], manifest
          for slug, league in manifest['leagues'].items():
              assert league['gate']['approved'] is True, (slug, league['gate'])
              assert league['gate']['blockers'] == [], (slug, league['gate'])
          PY
      - name: Run inherited conformal qualification separately by league
        run: |
          python scripts/run_direct_league_score_conformal_qualification.py \
            --benchmark-root /tmp/direct_league_score_preseason \
            --output-dir artifacts/reports/direct_league_score_conformal
      - name: Preserve research-only authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/reports/direct_league_score_conformal/qualification.json')
          manifest = json.loads(path.read_text())
          assert manifest['authority'] == 'direct_league_score_uncertainty_research_only', manifest
          assert manifest['automatic_promotion'] is False, manifest
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: direct-league-score-conformal-${{ github.sha }}
          path: artifacts/reports/direct_league_score_conformal
          if-no-files-found: error
          retention-days: 90
