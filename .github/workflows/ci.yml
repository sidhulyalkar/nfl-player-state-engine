name: ci
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,intelligence,api]'
      - name: Lint package, tests, and operational research scripts
        run: |
          ruff check src tests \
            scripts/acquire_game_intelligence_sources.py \
            scripts/build_game_intelligence.py \
            scripts/build_draft_survival_observations.py \
            scripts/train_draft_survival_model.py \
            scripts/run_draft_market_supply_ablation.py \
            scripts/archive_sleeper_drafts.py \
            scripts/normalize_draft_market_archive.py \
            scripts/join_draft_market_snapshots.py \
            scripts/record_shadow_checkpoint.py \
            scripts/settle_shadow_checkpoint.py \
            scripts/run_play_call_benchmark.py \
            scripts/run_game_simulation_replay.py \
            scripts/weekly_game_intelligence_refresh.py \
            scripts/run_v011_game_benchmark.py \
            scripts/run_v011_blend_benchmark.py \
            scripts/run_v012_factorial_benchmark.py \
            scripts/run_v013_drive_volume_benchmark.py \
            scripts/run_v014_transition_benchmark.py \
            scripts/run_v015_decision_benchmark.py \
            scripts/run_v016_terminal_benchmark.py \
            scripts/run_player_state_graph_research.py \
            scripts/run_evidence_factory.py
      - name: Compile Python sources and all scripts
        run: python -m compileall -q src scripts tests
      - name: Smoke Evidence Factory against frozen benchmark artifacts
        run: |
          python scripts/run_evidence_factory.py \
            --targets fantasy_points_ppr carries \
            --bootstrap-samples 200 \
            --output-dir /tmp/evidence_factory_smoke
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from player_state_engine.product.evidence_artifacts import EvidenceArtifactStore

          root = Path('/tmp/evidence_factory_smoke')
          manifest = json.loads((root / 'run_manifest.json').read_text(encoding='utf-8'))
          comparisons = pd.read_csv(root / 'paired_comparisons.csv')
          assert manifest['authority'] == 'research_evidence_only'
          assert manifest['promotion']['automatic'] is False
          assert manifest['champion_methods']['fantasy_points_ppr'] == 'quantile_engine'
          assert manifest['champion_methods']['carries'] == 'position_specific_quantile'
          assert manifest['multiple_testing']['p_value'] == 'finite_sample_plus_one_bootstrap_tail'
          assert set(comparisons.loc[comparisons['target'].eq('carries'), 'champion']) == {
              'position_specific_quantile'
          }
          assert comparisons['p_value'].notna().all()
          assert (comparisons['p_value'] > 0.0).all()
          assert comparisons['fdr_q_value'].notna().all()

          snapshot = EvidenceArtifactStore(root).snapshot()
          assert snapshot['data_mode'] == 'HISTORICAL_BACKTEST'
          assert snapshot['authority'] == 'research_evidence_only'
          assert snapshot['health']['integrity_verified'] is True
          assert snapshot['health']['integrity_failures'] == []
          PY
      - name: Smoke immutable shadow-season ledger
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          from pathlib import Path

          import pandas as pd

          from player_state_engine.product.shadow_season import (
              ShadowSeasonStore,
              build_shadow_settlement,
              build_shadow_snapshot,
              normalize_production_forecasts,
          )

          root = Path('/tmp/shadow_season_smoke')
          cutoff = datetime(2026, 9, 9, 18, 0, tzinfo=UTC)
          forecasts = normalize_production_forecasts(pd.DataFrame({
              'player_id': ['p1'],
              'position': ['WR'],
              'week_points_q10': [5.0],
              'week_points_q50': [10.0],
              'week_points_q90': [16.0],
          }))
          snapshot = build_shadow_snapshot(
              forecasts,
              season=2026,
              week=1,
              checkpoint='WEDNESDAY',
              prediction_cutoff=cutoff,
              captured_at=cutoff,
              sources=[{'name': 'smoke', 'available_at': cutoff}],
          )
          store = ShadowSeasonStore(root)
          assert store.save_snapshot(snapshot) is True
          settlement = build_shadow_settlement(
              snapshot,
              pd.DataFrame({'player_id': ['p1'], 'actual': [11.0]}),
          )
          assert store.save_settlement(settlement) is True
          summary = store.summary(season=2026)
          assert summary['health']['integrity_verified'] is True
          assert summary['snapshot_count'] == 1
          assert summary['settlement_count'] == 1
          assert summary['authority']['promotion_is_automatic'] is False
          PY
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gemini-fantasy-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/gemini-fantasy-console/package-lock.json
      - run: npm ci
      - name: Install Rollup Linux native binary
        run: |
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --package-lock=false "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
      - run: npm run build
