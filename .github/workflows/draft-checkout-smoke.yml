name: Draft checkout smoke

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".env.example"
      - "DRAFT_DAY.md"
      - "Makefile"
      - "scripts/check_draft_checkout.py"
      - "apps/gemini-fantasy-console/**"
      - ".github/workflows/draft-checkout-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/gemini-fantasy-console/package-lock.json
      - name: Install Python draft runtime
        run: python -m pip install -e '.[dev,api,intelligence,espn]'
      - name: Lint and compile checkout contract
        run: |
          ruff check scripts/check_draft_checkout.py
          python -m compileall -q scripts/check_draft_checkout.py
      - name: Install frontend exactly from lockfile
        working-directory: apps/gemini-fantasy-console
        run: npm ci
      - name: Check clean-checkout contract
        run: python scripts/check_draft_checkout.py --json
      - name: Verify package and API release identity
        run: |
          python - <<'PY'
          import tempfile
          from importlib.metadata import version
          from pathlib import Path

          from fastapi.testclient import TestClient

          from player_state_engine import __version__
          from player_state_engine.api.operational import create_app

          assert version('nfl-player-state-engine') == '0.17.0'
          assert __version__ == '0.17.0'
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              app = create_app(
                  store_root=root / 'leagues',
                  projections_path=root / 'missing.csv',
                  ranking_root=root / 'rankings',
                  game_intelligence_root=root / 'game-intelligence',
                  evidence_factory_root=root / 'evidence',
                  shadow_season_root=root / 'shadow',
                  structured_intelligence_root=root / 'structured',
              )
              response = TestClient(app).get('/health')
              assert response.status_code == 200
              assert response.json()['version'] == '0.17.0'
          PY
      - name: Build full React and Express workspace
        working-directory: apps/gemini-fantasy-console
        run: |
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --package-lock=false "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
          npm run build
